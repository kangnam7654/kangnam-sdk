[package]
name = "kangnam-harness-session-rpc"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Transport-agnostic JSON-RPC handlers for harness sessions: dispatches `cli.*` methods against a host-provided context."

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
rusqlite = { workspace = true }
kangnam-harness-session-core = { workspace = true }
kangnam-harness-session-agent = { workspace = true }
kangnam-router = { workspace = true }
tokio = { version = "1", features = ["sync"] }
dirs = "6"
uuid = { workspace = true }
async-trait = { workspace = true }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread"] }
