[package]
name = "kangnam-design-llm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Streaming AI client abstraction + provider impls (Gemini CLI, Claude CLI, LM Studio) for the kangnam-sdk design family."
keywords = ["llm", "ai", "streaming", "gemini", "claude"]
categories = ["api-bindings"]

[dependencies]
async-stream = { workspace = true }
base64 = { workspace = true }
futures = { workspace = true }
regex-lite = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["process", "io-util", "time"] }
tokio-stream = { version = "0.1", features = ["io-util"] }
tracing = { workspace = true }
uuid = { workspace = true }

[features]
default = []
# Expose FakeAiClient (in-memory test double). Gated so production builds
# don't ship the test harness.
test-util = []

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread"] }
