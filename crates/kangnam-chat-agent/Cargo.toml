[package]
name = "kangnam-chat-agent"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Persistent CLI agent session manager: spawns Claude Code / Codex CLI as long-running subprocesses, parses their stream-json output into rich semantic events (tool use, permissions, subagents, hooks), and exposes them through a transport-agnostic AgentEventSink."

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1", features = ["process", "io-util", "sync", "rt", "macros"] }
kangnam-router = { workspace = true }
kangnam-chat-core = { workspace = true }
async-trait = { workspace = true }
futures = "0.3"
uuid = { workspace = true }

[dev-dependencies]
kangnam-chat-core = { workspace = true, features = ["sqlite"] }
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "sync"] }
