[workspace]
resolver = "2"
members = [
    "apps/kangnam-client",
    "crates/chat/*",
    "crates/harness/*",
    "crates/router",
    "crates/design/*",
    "crates/fortune/*",
    "crates/pii-crypto",
]
exclude = ["crates/design/canvas-sdk-target"]

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.85"
authors = ["Kangnam Kim <kangnam7654@naver.com>"]
# Source-available proprietary — see LICENSE for full terms. SPDX `LicenseRef-`
# prefix marks this as a non-OSI custom license. publish=false hard-stops any
# accidental `cargo publish` to crates.io.
license = "LicenseRef-Proprietary-AllRightsReserved"
publish = false
repository = "https://github.com/kangnam7654/kangnam-sdk"

[workspace.dependencies]
# ── shared utilities ──
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
rusqlite = { version = "0.32", features = ["bundled"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "macros", "uuid", "chrono", "migrate"] }
tokio = { version = "1", features = ["rt", "macros"] }
tempfile = "3"
zip = { version = "2", default-features = false, features = ["deflate"] }
base64 = "0.22"
rand = "0.8"
sha2 = "0.10"

# ── workspace internal crates ──
kangnam-harness-core    = { path = "crates/harness/core" }
kangnam-harness-store   = { path = "crates/harness/store" }
kangnam-harness-runtime = { path = "crates/harness/runtime" }
kangnam-harness         = { path = "crates/harness/harness" }
kangnam-router        = { path = "crates/router" }
kangnam-chat-core     = { path = "crates/chat/core" }
kangnam-chat-agent    = { path = "crates/chat/agent" }
kangnam-chat-rpc      = { path = "crates/chat/rpc" }
kangnam-chat-server   = { path = "crates/chat/server" }
kangnam-chat          = { path = "crates/chat/chat" }
kangnam-design                = { path = "crates/design/design" }
kangnam-design-doc-slide      = { path = "crates/design/design-doc-slide" }
kangnam-design-doc-site       = { path = "crates/design/design-doc-site" }
kangnam-design-llm            = { path = "crates/design/design-llm" }
kangnam-design-editor-html    = { path = "crates/design/design-editor-html" }
kangnam-design-editor-slide   = { path = "crates/design/design-editor-slide" }
kangnam-design-editor-site    = { path = "crates/design/design-editor-site" }
kangnam-design-export-pptx    = { path = "crates/design/design-export-pptx" }
kangnam-design-direction      = { path = "crates/design/design-direction" }
kangnam-design-system         = { path = "crates/design/design-system" }
kangnam-design-skill          = { path = "crates/design/design-skill" }
kangnam-design-prompt         = { path = "crates/design/design-prompt" }
kangnam-design-artifact       = { path = "crates/design/design-artifact" }
kangnam-design-craft          = { path = "crates/design/design-craft" }
kangnam-design-tools          = { path = "crates/design/design-tools" }
saju-engine           = { path = "crates/fortune/saju-engine" }
tarot-engine          = { path = "crates/fortune/tarot-engine" }
pii-crypto            = { path = "crates/pii-crypto" }

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"
