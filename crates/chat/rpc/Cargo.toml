[package]
name = "kangnam-chat-rpc"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Transport-agnostic JSON-RPC handlers for the chat module: dispatches `cli.*` methods (listProviders, startSession, sendMessage, permissionResponse, stopSession) against a host-provided context."

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
rusqlite = { workspace = true }
kangnam-chat-core = { workspace = true }
kangnam-chat-agent = { workspace = true }
tokio = { version = "1", features = ["sync"] }
dirs = "6"
uuid = { workspace = true }
async-trait = { workspace = true }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread"] }
