[package]
name = "kangnam-design-editor-slide"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "LLM-driven slide deck generator + section editor for the kangnam-sdk design family."
keywords = ["ai", "slides", "llm", "editor"]
categories = ["multimedia"]

[dependencies]
async-stream = "0.3"
kangnam-design-llm = { workspace = true }
kangnam-design-doc-slide = { workspace = true }
kangnam-design-doc-site = { workspace = true }
futures = "0.3"
serde = { workspace = true }
serde_json = { workspace = true }
tera = "1"
thiserror = { workspace = true }
tracing = "0.1"
uuid = { workspace = true }

[features]
default = []
test-util = ["kangnam-design-llm/test-util"]

[dev-dependencies]
kangnam-design-llm = { workspace = true, features = ["test-util"] }
tokio = { workspace = true, features = ["rt-multi-thread"] }
