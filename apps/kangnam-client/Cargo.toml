[package]
name = "kangnam-client"
version.workspace = true
edition.workspace = true
authors.workspace = true

[lib]
name = "kangnam_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["full"] }
reqwest = { version = "0.12", features = ["stream", "json", "rustls-tls"], default-features = false }
rusqlite = { workspace = true }
keyring = "3"
sha2 = "0.10"
base64 = { workspace = true }
rand = "0.8"
uuid = { workspace = true }
futures = "0.3"
tokio-stream = "0.1"
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["cors", "fs"] }

async-trait = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
dirs = "6"
url = "2"
urlencoding = "2"
open = "5"
kangnam-chat = { workspace = true, features = ["server"] }
kangnam-harness = { workspace = true }
kangnam-design-skill = { workspace = true }
kangnam-design-system = { workspace = true }
kangnam-design-artifact = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
