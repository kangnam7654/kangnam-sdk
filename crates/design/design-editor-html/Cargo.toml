[package]
name = "kangnam-design-editor-html"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Generic HTML zone editor — raw-HTML zone-walking + LLM-driven edits. Domain-agnostic across slides/sites/dashboards/mobile."
keywords = ["ai", "html", "llm", "editor"]
categories = ["multimedia"]

[dependencies]
async-stream = "0.3"
kangnam-design-llm = { workspace = true }
futures = "0.3"
serde = { workspace = true }
serde_json = { workspace = true }
tera = "1"
thiserror = { workspace = true }
tracing = "0.1"
uuid = { workspace = true }

[features]
default = []
test-util = ["kangnam-design-llm/test-util"]

[dev-dependencies]
kangnam-design-llm = { workspace = true, features = ["test-util"] }
tokio = { workspace = true, features = ["rt-multi-thread"] }
