[package]
name = "design-editor-html"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Generic HTML zone editor — raw-HTML zone-walking + LLM-driven edits. Domain-agnostic across slides/sites/dashboards/mobile."
keywords = ["ai", "html", "llm", "editor"]
categories = ["multimedia"]

[dependencies]
async-stream = "0.3"
design-llm = { path = "../design-llm" }
futures = "0.3"
serde = { workspace = true }
serde_json = { workspace = true }
tera = "1"
thiserror = { workspace = true }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }

[features]
default = []
test-util = ["design-llm/test-util"]

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
