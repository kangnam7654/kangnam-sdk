[package]
name = "design-export-pptx"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Write editable .pptx files from a neutral slide-description IR. Pure Rust, no LibreOffice."
keywords = ["pptx", "powerpoint", "ooxml", "presentation"]
categories = ["multimedia", "encoding"]
readme = "README.md"

[dependencies]
zip = { version = "2", default-features = false, features = ["deflate"] }
quick-xml = "0.36"
serde = { workspace = true }
thiserror = { workspace = true }
image = { version = "0.25", default-features = false, features = ["png"] }
base64 = { workspace = true }
design-doc-slide = { path = "../design-doc-slide", optional = true }

[features]
default = ["slide-doc"]
slide-doc = ["dep:design-doc-slide"]

[dev-dependencies]
tempfile = { workspace = true }
serde_json = { workspace = true }
