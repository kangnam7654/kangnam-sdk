[package]
name = "canvas"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Build AI slide editors — umbrella crate bundling canvas-slide-doc, canvas-llm, canvas-editor, and canvas-pptx-writer"
keywords = ["ai", "slides", "llm", "editor"]
categories = ["multimedia"]

[dependencies]
canvas-slide-doc = { path = "../canvas-slide-doc", optional = true }
canvas-llm = { path = "../canvas-llm", optional = true }
canvas-editor = { path = "../canvas-editor", optional = true }
canvas-pptx-writer = { path = "../canvas-pptx-writer", optional = true, default-features = false }

[features]
default    = ["slides", "llm", "editor", "pptx-write"]
slides     = ["dep:canvas-slide-doc"]
llm        = ["dep:canvas-llm"]
editor     = ["dep:canvas-editor", "slides", "llm"]
pptx-write = ["dep:canvas-pptx-writer", "canvas-pptx-writer/slide-doc", "slides"]
test-util  = ["canvas-llm?/test-util", "canvas-editor?/test-util"]
full       = ["slides", "llm", "editor", "pptx-write"]
